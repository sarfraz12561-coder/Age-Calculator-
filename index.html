<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Sarfraz Ahmad</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 4px solid #2d6a31;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
        }

        .profile-logo img { width: 100%; height: 100%; object-fit: cover; }

        .main-title { color: #2d6a31; font-size: 28px; margin-bottom: 5px; font-weight: bold; }
        .sub-title { color: #888; font-size: 11px; font-weight: bold; letter-spacing: 1.2px; margin-bottom: 25px; text-transform: uppercase; }

        #dob {
            width: 100%;
            padding: 15px;
            border: 2px solid #4caf50;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }

        .calc-btn {
            flex: 2; background-color: #1b5e20; color: white; padding: 15px;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        .reset-btn {
            flex: 1; background-color: #d32f2f; color: white; padding: 15px;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        /* Result Area - Initially Hidden */
        #results-container {
            display: none; /* شروع میں چھپا ہوا */
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            text-align: left; padding: 15px 20px; margin-bottom: 15px;
            border-radius: 15px; border-left: 10px solid;
        }

        .card-label { font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; }
        .card-value { font-size: 21px; font-weight: bold; color: #333; margin-top: 5px; }

        .green-card { background-color: #e8f5e9; border-left-color: #2e7d32; }
        .orange-card { background-color: #fff3e0; border-left-color: #f57c00; }
        .blue-card { background-color: #e3f2fd; border-left-color: #1976d2; }

        .footer-branding { margin-top: 20px; font-size: 14px; color: #222; font-weight: bold; }

        .share-btn {
            width: 100%; background-color: #2e7d32; color: white; padding: 12px;
            border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <audio id="celebration-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <div class="container">
        <div class="profile-logo">
            <img src="https://i.ibb.co/Xrbbch9c/fotor-2023-1-14-11-58-10-removebg-preview.png" alt="Sarfraz Ahmad">
        </div>

        <div class="main-title">Age Calculator</div>
        <div class="sub-title">PROFESSIONAL AGE TRACKING TOOL</div>

        <input type="date" id="dob">

        <div class="btn-group">
            <button class="calc-btn" onclick="calculate()">CALCULATE AGE</button>
            <button class="reset-btn" onclick="resetForm()">RESET</button>
        </div>

        <div id="results-container">
            <div id="results">
                <div class="card green-card">
                    <span class="card-label">Exact Current Age</span>
                    <div class="card-value" id="exact-age"></div>
                </div>

                <div class="card orange-card">
                    <span class="card-label">Next Birthday Countdown</span>
                    <div class="card-value" id="next-bday"></div>
                </div>

                <div class="card blue-card">
                    <span class="card-label">Total Days Lived</span>
                    <div class="card-value" id="total-days"></div>
                </div>
            </div>

            <div class="footer-branding">Powered by Sarfraz Ahmad</div>
            <button class="share-btn">SHARE</button>
        </div>
    </div>

    <script>
        function calculate() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) {
                alert("براہ کرم پہلے اپنی تاریخِ پیدائش منتخب کریں!");
                return;
            }

            // Show results container
            document.getElementById('results-container').style.display = 'block';

            // Celebration
            document.getElementById('celebration-sound').play();
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            const dob = new Date(dobInput);
            const today = new Date();

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('exact-age').innerText = `${years} Years, ${months} Months, ${days} Days`;

            const diffTime = Math.abs(today - dob);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('total-days').innerText = diffDays.toLocaleString() + " Days";

            let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
            if (today > nextBday) nextBday.setFullYear(today.getFullYear() + 1);
            const daysToBday = Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24));
            document.getElementById('next-bday').innerText = `${daysToBday} Days to go`;
        }

        function resetForm() {
            document.getElementById('dob').value = "";
            document.getElementById('results-container').style.display = 'none'; // دوبارہ چھپا دیں
        }
    </script>
</body>
</html>
